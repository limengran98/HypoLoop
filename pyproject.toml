[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypoloop"
version = "1.0.0"
description = "Revising weight-editing plans from scientific feedback"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.0"]

[project.scripts]
hypoloop = "hypoloop.cli:main"

[tool.setuptools.packages.find]
include = ["hypoloop*"]
